<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>DZDPWA</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111827;color:#f3f6fb;font:16px system-ui;display:grid;place-items:center}
main{text-align:center;padding:28px}h1{font-size:28px}p{color:#a8b6ca;line-height:1.5}
a{display:inline-block;margin-top:16px;padding:14px 24px;background:#3979e8;color:white;text-decoration:none;border-radius:11px;font-weight:700}
</style></head><body><main><h1>DZDPWA</h1><p>Avvio dell'applicazione…</p><a id="open" href="#">APRI APPLICAZIONE</a></main>
<script>
const APP_URL="https://script.google.com/macros/s/AKfycbyKA31y1DVounPopnAS9LackRS0p9aXLNVZ_J91exSGPyV73B-rJVnwt5057z1mbhRg/exec";
const link=document.getElementById('open');
link.href=APP_URL;
link.addEventListener('click',function(event){event.preventDefault();window.location.assign(APP_URL);});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
setTimeout(()=>{window.location.replace(APP_URL);},500);
</script></body></html>
